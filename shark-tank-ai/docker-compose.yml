# Shark Tank AI — docker-compose

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shark-tank-ai:latest
    container_name: shark-tank-ai-app
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: unless-stopped

  # Placeholder for a future persistence/memory backend (e.g. Redis or
  # Postgres). Not used until MEMORY_BACKEND is switched away from
  # "in-memory" and the corresponding client code is implemented.
  # memory-store:
  #   image: redis:7-alpine
  #   container_name: shark-tank-ai-memory
  #   ports:
  #     - "6379:6379"
