[project]
name = "shark-tank-ai"
version = "1.0.0"
description = "An AI multi-agent Streamlit application where founders pitch to a panel of AI investor agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shantanu Dutt" }
]

dependencies = [
    "streamlit>=1.37",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "httpx>=0.27",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.urls]
Repository = "https://github.com/ShantanuDutt1/Shark-Tank-AI"
Issues = "https://github.com/ShantanuDutt1/Shark-Tank-AI/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agents",
    "orchestrator",
    "providers",
    "memory",
    "models",
    "prompts",
    "ui",
    "config",
    "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
